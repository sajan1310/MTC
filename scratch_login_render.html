<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MTC App</title>
    <!-- CSRF token for secure POSTs -->
    <meta name="csrf-token" content="dummy">
    <link rel="icon" href="/erp/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/erp/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css?v=1">
    <link rel="stylesheet" href="/css/login.css?v=1">
</head>

<body class="login-page login-page--split">
    <script>(function () { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode'); })()</script>
    <div class="login-shell">
        <div class="login-brand-panel">
            <div class="login-brand-content">
                <span class="logo-badge">
                    <img src="/img/Final_Logo.png" alt="Maharaja Bikes Logo" class="logo-img">
                </span>
                <h2 class="brand-title">Maharaja Bikes</h2>
                <p class="brand-tagline">Manage inventory, orders, and your entire bike business from one place.</p>
            </div>
        </div>
        <div class="login-mobile-bar">
            <span class="logo-badge">
                <img src="/img/Final_Logo.png" alt="Maharaja Bikes Logo" class="logo-img">
            </span>
            <span class="login-mobile-bar-title">Maharaja Bikes</span>
        </div>

        <div class="login-form-panel">
            <div class="login-container card">
                <div class="login-header">
                    <h1 class="login-title">Welcome back</h1>
                    <p class="login-subtitle">Sign in to your account to continue</p>
                </div>

                <form id="login-form" class="login-form" autocomplete="on">
                    <div class="form-group">
                        <label for="email">Email <span style="color: var(--danger-color);">*</span></label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="you@company.com" required
                            autofocus>
                    </div>
                    <div class="form-group password-row">
                        <label for="password">Password <span style="color: var(--danger-color);">*</span></label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                            required aria-describedby="password-help">
                        <button type="button" class="toggle-password" data-toggle-password="password"
                            aria-label="Show password"></button>
                        <small id="password-help" class="form-text" style="display:block; margin-top:0.375rem;">Use at least 8
                            characters</small>
                    </div>
                    <div class="form-group"
                        style="display:flex; align-items:center; justify-content: space-between; margin-bottom: 1.125rem;">
                        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-size: 0.9375rem;">
                            <input type="checkbox" id="remember" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="/auth.forgot_password"
                            style="color: var(--primary-color); font-size: 0.9375rem; text-decoration: none; font-weight: 500;">Forgot
                            password?</a>
                    </div>
                    <button id="login-btn" type="submit" class="button primary full">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 0.5rem;">
                            <path fill-rule="evenodd"
                                d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z" />
                            <path fill-rule="evenodd"
                                d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z" />
                        </svg>
                        Sign in
                    </button>
                </form>

                <p id="error-message" class="error-text" role="alert" aria-live="polite"></p>

                <div style="text-align: center; margin-top: 1.125rem; color: var(--text-muted); font-size: 0.9375rem;">
                    Don't have an account?
                    <a href="/auth.signup"
                        style="color: var(--primary-color); font-weight: 500; text-decoration: none;">Create account</a>
                </div>

                <div class="divider"><span>or</span></div>

                <!-- Google Sign-In button -->
                <div class="oauth-buttons">
                    <a class="btn google" href="/auth.auth_google" aria-label="Sign in with Google">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#FFC107"
                                d="M43.6 20.5H42V20H24v8h11.3C33.8 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.2-.4-3.5z" />
                            <path fill="#FF3D00"
                                d="M6.3 14.7l6.6 4.8C14.9 16.2 19.1 14 24 14c3 0 5.7 1.1 7.8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z" />
                            <path fill="#4CAF50"
                                d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.1C29.2 34.8 26.8 36 24 36c-5.2 0-9.6-3.4-11.2-8.1l-6.6 5.1C9.6 39.7 16.3 44 24 44z" />
                            <path fill="#1976D2"
                                d="M43.6 20.5H42V20H24v8h11.3c-1.3 3.7-4.9 6.5-9.3 6.5-5.2 0-9.6-3.4-11.2-8.1l-6.6 5.1C9.6 39.7 16.3 44 24 44c8.4 0 15.5-5.7 17.6-13.5.6-2 .9-4.1.9-6.5 0-1.3-.1-2.2-.4-3.5z" />
                        </svg>
                        <span>Sign in with Google</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js?v=1"></script>
</body>

</html>
