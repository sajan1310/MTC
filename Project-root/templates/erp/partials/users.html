<!-- User Management -- admin-only tab (gated at three layers: this partial
     is only included by index.html when current_user.role == 'admin', the
     sidebar entry is hidden the same way, and every RPC method it calls is
     enforced server-side via RpcSpec.roles regardless of what the client
     shows -- see app/erp/services/users_service.py. -->

<div id="usersTab" class="tab-content table-container" role="tabpanel" aria-labelledby="btn-usersTab">

  <div class="d-flex justify-content-between flex-wrap gap-2 mb-4">
    <div class="flex-grow-1" style="max-width: 400px;">
      <input type="text"
             id="searchUsers"
             class="form-control"
             placeholder="Search by name or email…"
             autocomplete="off"
             aria-label="Search users"
             onkeyup="App.Users.filterData(this.value)">
    </div>
    <button type="button" class="btn btn-outline-secondary" onclick="App.Users.loadData()">
      <i class="bi bi-arrow-clockwise me-1"></i>Refresh
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle mb-0">
      <caption class="visually-hidden">Registered users, their role, and account status</caption>
      <thead class="table-dark">
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
          <th scope="col" style="width: 16%;">Role</th>
          <th scope="col" style="width: 12%; text-align: center;">Status</th>
          <th scope="col" style="width: 14%;">Joined</th>
          <th scope="col" style="width: 14%; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr><td colspan="6" class="text-center p-4">Loading users…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="usersEmptyState" class="text-center p-5 border rounded-3 bg-white shadow-sm mt-3" style="display: none;">
    <i class="bi bi-people fs-1 text-muted d-block mb-3"></i>
    <h5 class="fw-bold text-dark">No matching users</h5>
    <p class="text-muted mb-0">Try a different search term.</p>
  </div>
</div>
