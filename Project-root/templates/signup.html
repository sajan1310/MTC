<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MTC App</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" href="{{ url_for('static', filename='erp/icons/favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='erp/icons/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ config.VERSION }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v={{ config.VERSION }}">
</head>
<body class="login-page">
    <script>(function(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');})()</script>
    <div class="login-container card">
        <div class="login-header">
            <a href="{{ url_for('auth.login') }}" class="back-link" aria-label="Back to login">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                </svg>
                Back to login
            </a>
            <span class="logo-badge">
                <img src="{{ url_for('static', filename='img/Final_Logo.png') }}" alt="MTC App Logo" class="logo-img">
            </span>
            <h1 class="login-title">Create your account</h1>
            <p class="login-subtitle">Enter your details to get started</p>
        </div>

        <form id="signup-form" class="login-form" autocomplete="on">
            <div class="form-group">
                <label for="name">Full name <span style="color: var(--danger-color);">*</span></label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Jane Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email <span style="color: var(--danger-color);">*</span></label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@company.com" required>
            </div>
            <div class="form-group password-row">
                <label for="password">Password <span style="color: var(--danger-color);">*</span></label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                <button type="button" class="toggle-password" data-toggle-password="password" aria-label="Show password"></button>
                <small class="form-text" style="display:block; margin-top:0.375rem;">At least 8 characters, with uppercase, lowercase, a number, and a symbol</small>
            </div>
            <div class="form-group password-row">
                <label for="confirm_password">Confirm password <span style="color: var(--danger-color);">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                <button type="button" class="toggle-password" data-toggle-password="confirm_password" aria-label="Show password"></button>
            </div>
            <button id="signup-btn" type="submit" class="button primary full" style="margin-top: 1rem;">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 0.5rem;">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                </svg>
                Create account
            </button>
        </form>

        <p id="signup-error" class="error-text" role="alert" aria-live="polite"></p>

        <div style="margin-top: 1.125rem; padding-top: 1.125rem; border-top: 1px solid var(--border-color); text-align: center;">
            <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.75rem;">By continuing, you agree to our terms and privacy policy</p>
            <p style="color: var(--text-muted); font-size: 0.9375rem;">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" style="color: var(--primary-color); font-weight: 500; text-decoration: none;">Sign in</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}?v={{ config.VERSION }}"></script>
</body>
</html>
