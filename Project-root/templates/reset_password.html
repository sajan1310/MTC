<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MTC App</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" href="{{ url_for('static', filename='erp/icons/favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='erp/icons/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ config.VERSION }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v={{ config.VERSION }}">
</head>
<body class="login-page">
    <script>(function(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode');})()</script>
    <div class="login-container card">
        <div class="login-header">
            <a href="{{ url_for('auth.login') }}" class="back-link" aria-label="Back to login">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                </svg>
                Back to login
            </a>
            <h1 class="login-title">Set a new password</h1>
            <p class="login-subtitle">Choose a strong password for your account</p>
        </div>

        {% if token_valid %}
        <form id="reset-form" class="login-form" autocomplete="off" data-token="{{ token }}">
            <div class="form-group password-row">
                <label for="password">New password <span style="color: var(--danger-color);">*</span></label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                <button type="button" class="toggle-password" data-toggle-password="password" aria-label="Show password"></button>
                <small class="form-text" style="display:block; margin-top:0.375rem;">At least 8 characters, with uppercase, lowercase, a number, and a symbol</small>
            </div>
            <div class="form-group password-row">
                <label for="confirm_password">Confirm new password <span style="color: var(--danger-color);">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                <button type="button" class="toggle-password" data-toggle-password="confirm_password" aria-label="Show password"></button>
            </div>
            <button id="reset-btn" type="submit" class="button primary full" style="margin-top: 1rem;">
                Reset password
            </button>
        </form>

        <p id="reset-error" class="error-text" role="alert" aria-live="polite"></p>
        {% else %}
        <p class="info-message" style="display: block;">
            This reset link is invalid or has expired. Reset links are only valid for 1 hour.
        </p>
        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="{{ url_for('auth.forgot_password') }}" class="button primary full">Request a new link</a>
        </div>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}?v={{ config.VERSION }}"></script>
</body>
</html>
