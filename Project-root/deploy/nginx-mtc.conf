# MTC ERP — nginx reverse proxy.
# Install to /etc/nginx/sites-available/mtc and symlink into sites-enabled.
#
# Pair this with PROXY_FIX=x_for=1,x_proto=1 in /etc/mtc/mtc.env. The
# X-Forwarded-* headers below are inert without it: Flask ignores untrusted
# proxy headers by default, so the app would see every request as coming
# from 127.0.0.1 over http.

upstream mtc_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mtc.example.com;

    # certbot --nginx rewrites this block to redirect to 443 and adds the
    # TLS server below. On a LAN deployment with no certificate, leave it
    # serving plain http and set BASE_URL=http://... to match -- the app
    # keys Secure cookies and HSTS off that scheme.
    location / {
        proxy_pass http://mtc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Must be >= gunicorn's --timeout 120, or nginx returns 504 while the
        # worker is still rendering and the user sees a failure for a request
        # that afterwards succeeds. Bulk PDF export is the case that gets
        # anywhere near this: roughly 0.66 s per document, single-threaded.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering on;
        proxy_redirect off;
    }

    # Served by nginx, not Flask -- this is most of what moving off a
    # container buys you. Flask never sees these requests.
    location /static/ {
        alias /opt/mtc/src/Project-root/static/;
        access_log off;

        # Filenames are unversioned, so a long max-age would strand clients
        # on stale JS after a deploy. The app's own cache-busting query
        # (config.py VERSION) changes per restart, and the service worker
        # holds the real offline copy anyway.
        expires 1h;
        add_header Cache-Control "public";

        # Third-party libraries are version-pinned IN THE FILENAME
        # (jquery-3.6.0.min.js), so these are safe to cache hard: a new
        # version is a new URL.
        location /static/erp/vendor/ {
            alias /opt/mtc/src/Project-root/static/erp/vendor/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Never cache the service worker. A stale sw.js pins every client to an
    # old precache manifest indefinitely -- the one file where a caching
    # mistake is not self-correcting.
    location = /static/erp/sw.js {
        alias /opt/mtc/src/Project-root/static/erp/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Matches MAX_CONTENT_LENGTH (16 MB) in config.py. If nginx's limit is
    # lower the upload dies at the proxy with a bare 413 and the app's own
    # error handling never runs.
    client_max_body_size 16m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Security headers come from flask-talisman on proxied responses. Do not
    # duplicate them here: two sources for one CSP is how a header ends up
    # silently doubled and the stricter copy wins.

    access_log /var/log/nginx/mtc.access.log;
    error_log  /var/log/nginx/mtc.error.log;
}
