#==============================================================================
# CI Workflow - Continuous Integration Pipeline
#==============================================================================
# Purpose: Automates build validation, code quality checks, security scanning,
#          and comprehensive testing for the Flask-based MTC application.
#
# Triggers: Runs on push to main/develop branches and on pull requests
#
# Jobs:
#   1. lint       - Code quality and style validation (Ruff)
#   2. security   - Dependency vulnerability scanning (pip-audit)
#   3. build      - Validates dependencies and project structure
#   4. test       - Runs test suite with coverage reporting
#
# Features:
#   - Dependency caching for faster builds
#   - Parallel job execution where possible
#   - Coverage reporting and artifact uploads
#   - Fail-fast disabled for comprehensive feedback
#==============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #============================================================================
  # JOB 0: Service Worker Cache Invalidation
  #============================================================================
  # Files under static/erp/ listed in sw.js's PRECACHE_URLS are served
  # cache-first, so an installed client keeps its own copy until CACHE_NAME
  # changes. Editing one without bumping the version ships it to nobody, and
  # nothing announces that -- worst of all for print-only changes, where the
  # app UI looks identical and the first report is "why is it still printing
  # the old layout".
  #
  # Its own job rather than a step in lint, because it needs the full history
  # (fetch-depth: 0) that lint has no reason to pay for.
  sw-cache:
    name: Service Worker Cache Bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CACHE_NAME was bumped
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Comparing $RANGE"
          # The script exits 0 for anything it cannot evaluate (an unknown
          # base, a force-push, the first commit on a branch), so a range it
          # cannot resolve reports and passes rather than blocking the build.
          python Project-root/scripts/check_sw_cache_bump.py --range "$RANGE"

  #============================================================================
  # JOB 0b: Frontend — lint + tests (CI-001)
  #============================================================================
  # 1.44 MB of application JavaScript ships to every user, and 23 Jest suites
  # / 390 tests, an ESLint config and a stylelint config all existed in the
  # repository — while `grep -n "npm\|node\|jest\|eslint"` across both workflow
  # files returned ZERO matches. None of it ran on a pull request. The tests
  # could rot unnoticed and a ReferenceError in production.js would reach the
  # factory floor, which is exactly what happened to bom.js's
  # DEFAULT_COST_CATEGORIES (see the FIXME there).
  #
  # `npm run verify` is eslint + stylelint + jest, and this job is blocking.
  frontend:
    name: Frontend (lint + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Project-root/package-lock.json'

      - name: Install dependencies
        working-directory: Project-root
        run: npm ci

      - name: Lint and test
        working-directory: Project-root
        run: npm run verify

  #============================================================================
  # JOB 1: Code Linting and Style Checks
  #============================================================================
  lint:
    name: Code Quality (Ruff Linter)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Project-root/requirements.txt'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          # PINNED, and it has to stay pinned. There is no ruff config in this
          # repo, so `ruff check` uses whatever ruff's DEFAULT rule set happens
          # to be -- which grows between releases. Unpinned, this step installed
          # 0.16.5 and reported 591 errors (FURB167, PIE810, SIM103, BLE001,
          # UP031, I001...) on a tree that 0.14.3 passes clean. Nothing in the
          # code had changed; the gate had.
          #
          # That failure also skipped `build` and `test`, which depend on this
          # job -- so the Python suite silently stopped running in CI at all.
          # Keep this in step with requirements.txt, and bump both deliberately.
          pip install ruff==0.14.3

      - name: Run Ruff linter
        run: |
          echo "::group::Running Ruff linter"
          ruff check Project-root/ --output-format=github
          echo "::endgroup::"
        continue-on-error: false

      # CI-002: was continue-on-error, so formatting never gated anything.
      - name: Run Ruff formatter check
        run: |
          echo "::group::Checking code formatting"
          ruff format --check Project-root/
          echo "::endgroup::" 

  #============================================================================
  # JOB 2: Security Vulnerability Scanning
  #============================================================================
  security:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Project-root/requirements.txt'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # CI-002: this step could never fail the build -- `|| true` swallowed the
      # exit code AND continue-on-error swallowed the step. A known CVE in a
      # dependency therefore merged silently. The report is still uploaded for
      # triage, but a HIGH/CRITICAL advisory now blocks.
      - name: Run pip-audit security scan (report)
        run: |
          echo "::group::Scanning dependencies for vulnerabilities"
          pip-audit -r Project-root/requirements.txt --desc --format json > security-report.json || true
          echo "::endgroup::"

      # Fails on any advisory that has NOT been explicitly triaged below.
      #
      # The previous version was named "Fail on high-severity advisories" but
      # never looked at severity -- `if affected: sys.exit(1)` failed on every
      # finding. With 21 open advisories, most of them inapplicable, it could
      # never go green, and a gate that is permanently red is one people learn
      # to scroll past. That is how this job spent its earlier life behind
      # `|| true`.
      #
      # So: fix what applies, and write down why the rest does not. A NEW
      # advisory is not on this list and turns the job red, which is the only
      # behaviour that makes the gate worth having. Re-triage the list when
      # bumping anything, and delete an entry the moment its bump lands.
      - name: Fail on untriaged advisories
        run: |
          echo "::group::Evaluating advisories"

          # One entry per advisory, each with the reason it does not apply.
          # Delete an entry the moment a bump makes it moot -- a stale ignore
          # is how a real finding gets waved through later.
          TRIAGED=(
            # werkzeug safe_join: Windows device names and UNC paths. This
            # deploys on Ubuntu, where that code path cannot be reached.
            # The fixes live in werkzeug 3.1.x, which requires Flask 3.1.
            --ignore-vuln PYSEC-2026-2044
            --ignore-vuln PYSEC-2026-2046
            --ignore-vuln PYSEC-2026-2320

            # flask Vary: Cookie. Needs a caching proxy that caches responses
            # carrying cookies. The nginx in front of this does not cache.
            --ignore-vuln PYSEC-2026-2151

            # requests extract_zipped_paths(). Never called: requests is used
            # only for the OAuth token/userinfo exchange.
            --ignore-vuln PYSEC-2026-2275

            # python-dotenv set_key()/unset_key() symlink handling. The app
            # only ever calls load_dotenv().
            --ignore-vuln PYSEC-2026-2270

            # flask-cors path matching. Fixed only in the 6.0.0 major bump,
            # whose matching semantics changed. This app passes one explicit
            # origin and no path patterns, so none of the three apply.
            --ignore-vuln PYSEC-2026-1383
            --ignore-vuln PYSEC-2026-1384
            --ignore-vuln PYSEC-2026-1385

            # waitress. Used only by run_production.py, the Windows
            # development path; Linux serves through gunicorn.
            --ignore-vuln PYSEC-2024-210
            --ignore-vuln PYSEC-2024-211

            # pytest /tmp/pytest-of-{user} permissions on shared UNIX hosts.
            # Test-only, and the fix is the pytest 9 major bump.
            --ignore-vuln PYSEC-2026-1845
          )

          pip-audit -r Project-root/requirements.txt --desc \
                    --progress-spinner off "${TRIAGED[@]}"
          echo "::endgroup::"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
          if-no-files-found: warn

  #============================================================================
  # JOB 3: Build Validation
  #============================================================================
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint]  # Run after lint passes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Project-root/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Project-root/requirements.txt

      - name: Verify installation
        working-directory: Project-root
        run: |
          echo "::group::Installed packages"
          pip list
          echo "::endgroup::"
          
          echo "::group::Flask version check"
          python -c "import flask; print(f'Flask version: {flask.__version__}')"
          echo "::endgroup::"

      - name: Check for syntax errors
        working-directory: Project-root
        run: |
          echo "::group::Python syntax validation"
          python -m py_compile ../app.py wsgi.py
          python -m compileall -q app/
          echo "::endgroup::"

  #============================================================================
  # JOB 4: Test Suite with Coverage
  #============================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [build]  # Run after build validation passes
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    # PostgreSQL service container for database testing
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:testpass@127.0.0.1:5432/testdb
      DB_USER: postgres
      DB_PASS: testpass
      DB_NAME: testdb
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
      FLASK_ENV: testing
      SECRET_KEY: test-secret-key-for-ci
      RATELIMIT_STORAGE_URL: memory://
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'Project-root/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Project-root/requirements.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if psql "postgresql://postgres:testpass@127.0.0.1:5432/testdb" -c '\q' 2>/dev/null; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Create test databases
        run: |
          # Create 'testuser' database for legacy test compatibility
          psql "postgresql://postgres:testpass@127.0.0.1:5432/testdb" \
            -tAc "SELECT 1 FROM pg_database WHERE datname='testuser'" | grep -q 1 || \
          psql "postgresql://postgres:testpass@127.0.0.1:5432/testdb" \
            -c "CREATE DATABASE testuser;"
          
          echo "✅ Test databases created successfully"
      # NOTE: the test database schema is NOT built here.
      #
      # tests/conftest.py's session-scoped setup_test_db fixture creates the
      # database if absent and runs migrations/erp/runner.py -- the single
      # migration path (MIG-001), the same code the deploy scripts run. Doing
      # it again here would be a second, divergent definition of the schema,
      # which is exactly the problem MIG-001 removed.
      #
      # Three steps stood here and had to go: they ran
      # migrations/init_schema.sql, migrations/migrations.py and
      # migrations/migration_fix_schema_nov2025.py, all of which moved into
      # migrations/legacy/ and are no longer executed by anything. The first
      # of them did `exit 1` on the file being absent, so this job could not
      # pass at all -- and because `build` gates `test`, the Python suite was
      # never reached in CI even once lint was fixed.

      - name: Run tests with coverage
        working-directory: Project-root
        run: |
          echo "::group::Running pytest with coverage"
          python -m pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v \
            --tb=short
          echo "::endgroup::"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            Project-root/coverage.xml
            Project-root/htmlcov

      # CI-002 / TEST-001. This gate was decorative in two ways at once: the
      # threshold was 25% while actual coverage was 85%, and it called
      # sys.exit(0) even when below -- so it could not fail whatever happened.
      #
      # The global threshold is now set just under the real figure so a
      # genuine regression trips it. But the global number was never the
      # problem: coverage was INVERTED. Business services sat at 86-96% while
      # the code deciding who may do what sat far lower --
      # roles_service.py 36%, app/utils.py 39%, auth/routes.py 49% -- and all
      # three P0 security findings in the audit lived in those untested lines.
      # So the per-module floors below are the part that matters.
      - name: Coverage threshold check
        if: matrix.python-version == '3.11'
        working-directory: Project-root
        env:
          MIN_COVERAGE: 85
        run: |
          echo "::group::Coverage threshold validation"
          python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          overall_floor = float(os.environ.get("MIN_COVERAGE", "86"))

          # Per-module floors, set just under the CURRENTLY ACHIEVED figure.
          #
          # This is a ratchet, not an aspiration. A gate that is always failing
          # is a gate everyone learns to ignore, which is how the previous one
          # (25%, and exit(0) even when below) ended up meaning nothing. So
          # each number here has been measured, and each one has been raised
          # as the coverage behind it was earned.
          #
          # rpc.py's per-tab gate and users_service's role assignment -- the
          # two TEST-001 gaps this block used to name as outstanding -- are
          # now at 100%, and the gate tests were mutation-tested rather than
          # trusted: four ways of breaking the gate were each injected and
          # each was caught. What remains is auth/routes.py's OAuth callback
          # token-exchange branch.
          # Floors sit a little under the measured figure so ordinary churn does
          # not break the build, but high enough that losing a test is caught.
          # The four at 100% are the authorization and idempotency path: the
          # audit's finding was that the code deciding who may do what was the
          # least verified code in the application (TEST-001).
          FLOORS = {
              "app/erp/rpc.py": 97.0,                      # 100% measured; was 77%
              "app/erp/mutations.py": 95.0,                # 100% measured; was 87%
              "app/erp/services/roles_service.py": 98.0,   # 100% measured; was 36%
              "app/erp/services/users_service.py": 97.0,   # 100% measured; was 67%
              "app/erp/services/db_backup.py": 78.0,       # 82% measured
              "app/auth/routes.py": 70.0,                  # 72% measured; was 49%
              # 82% measured -- but part of that rise is 22 statements of dead
              # code removed (the unreferenced get_or_create_master_id /
              # get_or_create_item_master_id), not new tests. Floor set on the
              # honest number, not the flattering one.
              "app/utils.py": 75.0,
          }

          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          overall = float(root.attrib.get("line-rate", "0")) * 100.0

          # coverage.xml paths are relative to <source>, which for `--cov=app`
          # is the app/ directory itself -- so a class's filename reads
          # "auth/routes.py", not "app/auth/routes.py". Index both forms so
          # the floors below stay readable as full repo paths and keep
          # matching if the --cov target ever changes. (Getting this wrong is
          # silent: every module reports NOT MEASURED and the gate fails for
          # a reason that has nothing to do with coverage.)
          per_file = {}
          for cls in root.iter("class"):
              name = (cls.attrib.get("filename") or "").replace("\\", "/")
              rate = float(cls.attrib.get("line-rate", "0")) * 100.0
              per_file[name] = rate
              if not name.startswith("app/"):
                  per_file[f"app/{name}"] = rate

          failures = []
          print(f"Overall coverage: {overall:.2f}%  (floor {overall_floor:.0f}%)")
          if overall < overall_floor:
              failures.append(f"overall {overall:.2f}% < {overall_floor:.0f}%")

          print("\nSecurity-critical modules (authorization and identity):")
          for target, floor in FLOORS.items():
              matches = [v for k, v in per_file.items() if k == target or k.endswith("/" + target)]
              if not matches:
                  print(f"  {target}: NOT MEASURED")
                  failures.append(f"{target} produced no coverage data")
                  continue
              rate = min(matches)
              status = "ok" if rate >= floor else "BELOW FLOOR"
              print(f"  {target}: {rate:.2f}%  (floor {floor:.0f}%)  [{status}]")
              if rate < floor:
                  failures.append(f"{target} {rate:.2f}% < {floor:.0f}%")

          if failures:
              for item in failures:
                  print(f"::error::coverage below floor -- {item}")
              sys.exit(1)
          print("\nAll coverage floors met.")
          EOF
          echo "::endgroup::"

